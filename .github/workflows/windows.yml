name: Windows build
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check release policy
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Test and package self-contained app
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/GamePass2Steam/GamePass2Steam.csproj -Raw)).Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Smoke test bundled runtime without SDK resolution
        shell: pwsh
        run: ./scripts/test-package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: GamePass2Steam-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
