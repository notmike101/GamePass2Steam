name: Release dev to main
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check release policy
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Prepare patch version or resume this PR's release
        shell: pwsh
        run: ./scripts/release.ps1 -Phase Prepare
      - name: Test and package release
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Smoke test bundled runtime without SDK resolution
        shell: pwsh
        run: ./scripts/test-package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: GamePass2Steam-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Push versioned tags and publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/release.ps1 -Phase Publish
